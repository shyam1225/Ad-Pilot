<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f111a"/>
      <stop offset="40%" stop-color="#18132b"/>
      <stop offset="80%" stop-color="#2a164d"/>
      <stop offset="100%" stop-color="#120c24"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bgGrad)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="850" cy="220" r="280" fill="#a855f7" opacity="0.25" filter="url(#glow)"/>
  <circle cx="200" cy="800" r="320" fill="#6366f1" opacity="0.2" filter="url(#glow)"/>

  <!-- Central Visual Container Card -->
  <rect x="80" y="80" width="920" height="920" rx="32" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>

  <!-- Top Platform & Brand Tag -->
  <rect x="140" y="140" width="180" height="44" rx="22" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-opacity="0.4"/>
  <text x="230" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#d8b4fe" text-anchor="middle" letter-spacing="1">
    SNAPCHAT
  </text>

  <!-- Visual Mock Icon / Graphic -->
  <circle cx="540" cy="460" r="160" fill="#18132e" stroke="url(#accentGrad)" stroke-width="4"/>
  <circle cx="540" cy="460" r="120" fill="#a855f7" fill-opacity="0.1"/>
  <path d="M490 460 L540 410 L590 460 L540 510 Z" fill="url(#accentGrad)"/>
  <circle cx="540" cy="460" r="20" fill="#ffffff" opacity="0.9"/>

  <!-- Typography Content -->
  <text x="540" y="690" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">
    ZenPlus Hybrid ANC headphones
  </text>

  <text x="540" y="750" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="500" fill="#cbd5e1" text-anchor="middle">
    Focus Mode: On
  </text>

  <!-- Call to Action Button -->
  <g transform="translate(410, 810)">
    <rect width="260" height="70" rx="35" fill="url(#accentGrad)"/>
    <text x="130" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">
      Swipe Up →
    </text>
  </g>
</svg>